name: Build theme release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package installable theme
        run: |
          mkdir -p artifacts/release
          tar -czf artifacts/release/theme.tar.gz theme.json preview.png dist
          cd artifacts/release
          sha256sum theme.tar.gz > theme.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-theme
          path: artifacts/release/*
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orbit-theme
          path: artifacts/release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/release/* --repo "$GITHUB_REPOSITORY" --title "Orbit $GITHUB_REF_NAME" --generate-notes
